<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股籌碼報告</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #656d76;
  --border: #d8dee4; --head: #eef1f4; --up: #d1242f; --down: #1a7f37;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0;
    --border: #30363d; --head: #1f252d; --up: #ff6b6b; --down: #3fb950;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  font-size: 14px; line-height: 1.5;
}
main { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.subtitle { color: var(--muted); margin: 0 0 16px; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
nav a {
  color: var(--text); text-decoration: none; background: var(--card);
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-size: 13px;
}
section {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px;
}
h2 { font-size: 17px; margin: 0 0 8px; }
.note { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; white-space: nowrap; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { background: var(--head); font-weight: 600; text-align: left; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.up { color: var(--up); }
td.down { color: var(--down); }
tbody tr:hover { background: var(--head); }

ul.reports { list-style: none; margin: 0; padding: 0; }
ul.reports li { border-bottom: 1px solid var(--border); }
ul.reports li:last-child { border-bottom: 0; }
ul.reports a {
  display: flex; justify-content: space-between; padding: 12px 4px;
  color: var(--text); text-decoration: none;
}
ul.reports a:hover { background: var(--head); }
.badge { color: var(--up); font-size: 12px; }
h2.list-title { font-size: 16px; margin: 0 0 4px; }
</style>
</head>
<body>
<main>
<h1>台股每日籌碼報告</h1>
<p class="subtitle">資料來源：FinMind｜共 4 份日報、1 份週報</p>
<section>
<h2 class="list-title">每週週報</h2>
<ul class="reports">
<li><a href="weekly-2026-10-02.html"><span>09/28～10/02 週報</span><span class="badge">最新</span></a></li>
</ul>
</section>
<section>
<h2 class="list-title">每日報告</h2>
<ul class="reports">
<li><a href="2026-10-02.html"><span>2026-10-02（五）</span><span class="badge">最新</span></a></li>
<li><a href="2026-10-01.html"><span>2026-10-01（四）</span></a></li>
<li><a href="2026-09-30.html"><span>2026-09-30（三）</span></a></li>
<li><a href="2026-09-29.html"><span>2026-09-29（二）</span></a></li>
</ul>
</section>
</main>
</body>
</html>
