name: 台股每日籌碼報告

on:
  schedule:
    # 週一至週五 21:07（台灣時間）＝ 13:07 UTC；GitHub 排程可能延遲數分鐘到數十分鐘
    - cron: "7 13 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "查詢日期 YYYY-MM-DD（留白＝最近一個交易日）"
        required: false
        default: ""
      notify:
        description: "推播到 Telegram / LINE"
        type: boolean
        default: true

permissions:
  contents: write # 推送報告網頁到 gh-pages 分支

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生報告
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          # GitHub Pages 網址，推播摘要會附上完整報告連結
          export REPORT_BASE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          args=(--summary-file reports/summary.txt)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 排程執行：只處理當天資料，休市日自動跳過
            args+=(--today-only)
          elif [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          mkdir -p reports
          python chip_report.py "${args[@]}"

      - name: 發布到 GitHub Pages
        id: pages
        if: hashFiles('reports/*.html') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$remote"
          fi
          for f in reports/chip_report_*.html; do
            day=$(python pages.py site "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          done
          echo "url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/${day}.html" >> "$GITHUB_OUTPUT"
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "網頁沒有變更"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "報告 ${day}"
          git push -q origin gh-pages

      - name: 等待網頁上線
        if: steps.pages.outputs.url != ''
        continue-on-error: true
        run: |
          # GitHub Pages 更新約需 1 分鐘；最多等 3 分鐘，逾時仍繼續推播
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null "${{ steps.pages.outputs.url }}"; then
              echo "網頁已上線：${{ steps.pages.outputs.url }}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::網頁尚未上線，請確認已在 Settings → Pages 啟用 gh-pages 分支"

      - name: 推播
        if: >-
          !cancelled() && hashFiles('reports/summary.txt') != '' &&
          (github.event_name == 'schedule' || github.event.inputs.notify == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python notify.py reports/summary.txt

      - name: 上傳報告檔案
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
