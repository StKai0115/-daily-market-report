name: 台股每日籌碼報告

on:
  schedule:
    # 備援排程：週一至週五 18:07～22:07（台灣時間）每小時一次＝ 10:07～14:07 UTC。
    # GitHub 排程在忙碌時可能延遲或被略過，主要改由外部定時服務（cron-job.org）
    # 以 workflow_dispatch＋auto=true 觸發，見 README「外部定時觸發」。
    # 當天推播成功後，之後的觸發會在「檢查今天是否已推播」步驟直接跳過。
    - cron: "7 10-14 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "查詢日期 YYYY-MM-DD（留白＝最近一個交易日）"
        required: false
        default: ""
      notify:
        description: "推播到 Telegram / LINE（測試時取消勾選，不消耗推播額度）"
        type: boolean
        default: true
      publish:
        description: "發布報告網頁"
        type: boolean
        default: true
      auto:
        description: "自動排程模式（給外部定時服務使用；手動執行請保持不勾選）"
        type: boolean
        default: false

permissions:
  contents: write # 推送報告網頁到 gh-pages 分支

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 判斷執行模式
        id: mode
        run: |
          # 自動模式：GitHub 排程，或外部定時服務以 auto=true 觸發
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.auto }}" = "true" ]; then
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto=false" >> "$GITHUB_OUTPUT"
          fi
          # 目標交易日：台灣時間中午以前執行（例如排程延遲到半夜）視為前一天的推播
          echo "day=$(TZ=Asia/Taipei date -d '-12 hours' +%F)" >> "$GITHUB_OUTPUT"

      - name: 檢查今天是否已推播
        id: check
        if: steps.mode.outputs.auto == 'true'
        run: |
          # 以 gh-pages 分支上的 notified/YYYY-MM-DD.txt 判斷當天是否已推播成功；
          # 只發布網頁、沒有推播的手動測試不會影響晚上的排程
          day="${{ steps.mode.outputs.day }}"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null && git cat-file -e "FETCH_HEAD:notified/${day}.txt" 2>/dev/null; then
            echo "${day} 已推播過，本次排程跳過"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "${day} 尚未推播，開始產生"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        if: steps.check.outputs.done != 'true'
        run: pip install -r requirements.txt

      - name: 產生報告
        if: steps.check.outputs.done != 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          AUTO: ${{ steps.mode.outputs.auto }}
          TARGET_DAY: ${{ steps.mode.outputs.day }}
        run: |
          # GitHub Pages 網址，推播摘要會附上完整報告連結
          export REPORT_BASE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          args=(--summary-file reports/summary.txt)
          if [ "$AUTO" = "true" ]; then
            # 自動模式：只處理目標交易日的資料，休市或尚未更新時跳過（下一次觸發再試）
            args+=(--date "$TARGET_DAY" --today-only)
          elif [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          mkdir -p reports
          python chip_report.py "${args[@]}"

      - name: 發布到 GitHub Pages
        id: pages
        if: >-
          hashFiles('reports/*.html') != '' &&
          (steps.mode.outputs.auto == 'true' || github.event.inputs.publish == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$remote" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$remote"
          fi
          for f in reports/chip_report_*.html; do
            day=$(python pages.py site "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          done
          # 週五另有週報，發布為 weekly-YYYY-MM-DD.html
          for f in reports/weekly_report_*.html; do
            if [ -e "$f" ]; then
              python pages.py site "$f"
            fi
          done
          echo "url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/${day}.html" >> "$GITHUB_OUTPUT"
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "網頁沒有變更"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "報告 ${day}"
          git push -q origin gh-pages

      - name: 等待網頁上線
        if: steps.pages.outputs.url != ''
        continue-on-error: true
        run: |
          # GitHub Pages 更新約需 1 分鐘；最多等 3 分鐘，逾時仍繼續推播
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null "${{ steps.pages.outputs.url }}"; then
              echo "網頁已上線：${{ steps.pages.outputs.url }}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::網頁尚未上線，請確認已在 Settings → Pages 啟用 gh-pages 分支"

      - name: 推播
        id: notify
        if: >-
          !cancelled() && hashFiles('reports/summary.txt') != '' &&
          (steps.mode.outputs.auto == 'true' || github.event.inputs.notify == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # 推播對象（Settings → Secrets and variables → Actions → Variables）：
          # LINE_SEND_MODE＝self（預設）／list／broadcast；list 模式的收件人列在 LINE_USER_IDS
          LINE_SEND_MODE: ${{ vars.LINE_SEND_MODE }}
          LINE_USER_IDS: ${{ vars.LINE_USER_IDS }}
        run: python notify.py reports/summary.txt

      - name: 記錄已推播
        if: steps.notify.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 以報告的交易日期記錄，當晚排程據此判斷是否已推播過
          day=$(ls reports/chip_report_*.html reports/chip_report_*.md 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git clone -q --depth 1 --branch gh-pages "$remote" marker
          else
            git init -q -b gh-pages marker
            git -C marker remote add origin "$remote"
          fi
          mkdir -p marker/notified
          echo "推播時間：$(TZ=Asia/Taipei date '+%F %T')（${{ github.event_name }}，auto=${{ steps.mode.outputs.auto }}）" > "marker/notified/${day}.txt"
          cd marker
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "已推播 ${day}"
          git push -q origin gh-pages

      - name: 上傳報告檔案
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
